    defaultConfig {
        minSdkVersion 24
        //noinspection OldTargetApi
        targetSdk = 36

        versionCode 41
        versionName '4.23.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation": "$projectDir/schemas".toString(),
